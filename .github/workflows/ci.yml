name: "CI"

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions-rust-lang/setup-rust-toolchain@v1"
        with:
          components: "clippy,rustfmt"
          toolchain: "stable"
      - uses: "extractions/setup-just@v3"
      - uses: "Swatinem/rust-cache@v2"
      - run: "just full-check"
      - run: "just test"
      - run: "cargo build --bins"
      - run: |
          echo "## CI result (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  audit:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "EmbarkStudios/cargo-deny-action@v2"

  python-windows-ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maturin and pytest
        run: pip install maturin pytest
      - name: Build and install
        working-directory: bindings/python
        run: maturin develop
      - name: Verify import
        working-directory: bindings/python
        run: python -c "from rocksgraph._rocksgraph import PyGraph; print('ok')"
      - name: Run tests
        working-directory: bindings/python
        run: python -m pytest tests/ -q

  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maturin and pytest
        run: pip install "maturin>=1.5,<2.0" pytest
      - name: Build and install
        working-directory: bindings/python
        run: maturin develop
      - name: Run Python tests
        working-directory: bindings/python
        run: python -m pytest tests/ -v
