[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rocksgraph"
version = "0.2.1"
description = "Embeddable, ACID-compliant property graph database with Gremlin traversals and integrated HNSW vector search."
authors = [{ name = "Austin Han", email = "austinhan1024@gmail.com" }]
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["graph-database", "vector-search", "gremlin", "embedded", "rocksdb", "hnsw"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
module-name = "rocksgraph._rocksgraph"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "PYI",
    "RUF",
    "SIM",
    "PIE",
    "RET",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["rocksgraph"]
