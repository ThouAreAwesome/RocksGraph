# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
# Run locally with `just audit`; enforced in CI via `.github/workflows/ci.yml`.

[graph]
all-features = false
no-default-features = false

# `cargo deny check advisories` — flags dependencies with known RUSTSEC vulnerabilities
# or that are unmaintained/yanked.
[advisories]
ignore = [
    # pyo3 0.21.2: PyString::from_object overflow (RUSTSEC-2025-0020).
    # Not exploitable in rocksgraph-python: we never pass untrusted &str to
    # PyString::from_object. Will upgrade when macOS linker issues with 0.24+ are resolved.
    { id = "RUSTSEC-2025-0020", reason = "not exploitable; blocked on pyo3 upgrade" },
    # pyo3 0.21.2: missing Sync bound on PyCFunction::new_closure (RUSTSEC-2026-0177).
    # Not exploitable: we run under GIL, no detach() usage, no free-threaded Python.
    { id = "RUSTSEC-2026-0177", reason = "not exploitable; blocked on pyo3 upgrade" },
]

# `cargo deny check licenses` — all licences below are permissive.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# `cargo deny check bans` — warn (not deny) on duplicate dependency versions for now;
# tighten to "deny" once the dependency tree is deliberately curated.
[bans]
multiple-versions = "warn"
wildcards = "deny"

# `cargo deny check sources` — only allow crates.io; no git/alternate-registry deps.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
