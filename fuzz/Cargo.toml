[package]
name = "rocksgraph-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rocksgraph]
path = "../rocksgraph"
version = "0.2.3"
features = ["fuzzing"]

[[bin]]
name = "decode_bytecode"
path = "fuzz_targets/decode_bytecode.rs"
test = false
doc = false
bench = false
